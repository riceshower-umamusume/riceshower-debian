[package]
name = "noctalia-setup"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
description = "Noctalia full ecosystem installer for Debian stable/testing/sid"
repository = "https://github.com/riceshower-umamusume/riceshower-debian"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[dev-dependencies]
tempfile = "3.12"
