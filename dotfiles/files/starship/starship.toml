format = """
$username$hostname$directory$git_branch$git_status$cmd_duration
$line_break$character"""

[username]
show_always = false
style_user = "bold yellow"
style_root = "bold red"

[hostname]
ssh_only = true
style = "bold green"

[directory]
style = "bold blue"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "bold purple"
symbol = " "

[git_status]
style = "bold red"
format = '[$all_status$ahead_behind]($style) '

[cmd_duration]
min_time = 2000
style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
