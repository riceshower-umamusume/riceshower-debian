name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --all
      - run: cargo build --release
      - run: ./install.sh list-components

  shell:
    name: Shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck install.sh

  debian:
    name: Debian ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:13, debian:testing, debian:sid]
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y curl ca-certificates build-essential pkg-config git
      - run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
      - run: . "$HOME/.cargo/env" && cargo fmt --all -- --check && cargo clippy --all-targets -- -D warnings && cargo test --all && cargo build --release
      - run: useradd -m ci && chown -R ci:ci .
      - run: su ci -c 'cd "$GITHUB_WORKSPACE" && ./install.sh list-components'
      - run: su ci -c 'cd "$GITHUB_WORKSPACE" && ./install.sh install --dry-run || true'
