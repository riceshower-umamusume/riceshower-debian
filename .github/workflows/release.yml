name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release --locked
      - run: |
          mkdir -p dist
          cp target/release/noctalia-setup dist/
          cp install.sh dist/
          cp -r manifest dist/
          cp -r dotfiles dist/
          cp -r apps dist/
          tar -C dist -czf "riceshower-debian-${GITHUB_REF_NAME}-x86_64.tar.gz" .
          sha256sum "riceshower-debian-${GITHUB_REF_NAME}-x86_64.tar.gz" > SHA256SUMS
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: riceshower-debian-*.tar.gz
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            riceshower-debian-*.tar.gz
            SHA256SUMS
